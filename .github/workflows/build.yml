name: Build

on:
  workflow_call:
  push:
    paths:
      - 'pyproject.toml'
      - 'tests/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Lint
        run: poetry run ruff check .

      - name: Style Check
        run: poetry run black --check .

      - name: Test & Coverage
        run: |
          poetry run coverage run -m pytest
          poetry run coverage report -m
