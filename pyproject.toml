[tool.poetry]
name = "import-export"
version = "0.1.0"
description = "Import Export"
authors = []
readme = "README.md"
packages = [
    { include = "importer" }
]

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.32.3"
pydantic-settings = "^2.7.1"
cachetools = "^5.5.0"
tenacity = "^9.0.0"
google-cloud-bigquery = "^3.27.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.8.5"
black = "^24.10.0"
pytest = "^8.3.4"
pyhamcrest = "^2.1.0"
coverage = "^7.6.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.poetry.scripts]
import = "importer.main:start_import"
